openapi: 3.0.3
info:
  title: API Thuyết minh tự động đa ngôn ngữ
  version: 1.0.0
  description: |
    Backend tối giản phục vụ FE (React Native + React.js). Chỉ đọc dữ liệu.
    Nội dung thuyết minh đã được dịch sẵn; việc đọc thành tiếng dùng TTS của thiết bị
    (`ttsLocale` trong /languages cho biết locale cần truyền vào expo-speech / Web Speech API).

    **Quy ước chung**
    - Tiền tố: `/api/v1`
    - `lang` mặc định `vi`. Nếu điểm chưa có bản dịch của `lang`, API trả bản tiếng Việt
      và đặt `fallback: true` (trường `lang` luôn là ngôn ngữ thực tế của nội dung).
    - Lỗi có dạng `{ "error": { "code": "...", "message": "..." } }`.
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://thuyet-minh-api.onrender.com
    description: Render (cập nhật URL thật sau khi deploy)
tags:
  - name: Languages
  - name: Spots
paths:
  /api/v1/languages:
    get:
      tags: [Languages]
      summary: Danh sách ngôn ngữ đang hỗ trợ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Language" }
              example:
                data:
                  - { code: vi, name: Vietnamese, nativeName: Tiếng Việt, ttsLocale: vi-VN }
                  - { code: en, name: English, nativeName: English, ttsLocale: en-US }
  /api/v1/spots:
    get:
      tags: [Spots]
      summary: Danh sách điểm tham quan (không kèm bài thuyết minh đầy đủ)
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: q
          in: query
          description: Lọc theo tên/mô tả ngắn (không phân biệt hoa thường)
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SpotSummary" }
        "400": { $ref: "#/components/responses/InvalidLang" }
  /api/v1/spots/{idOrSlug}:
    get:
      tags: [Spots]
      summary: Chi tiết một điểm (kèm bài thuyết minh) theo id hoặc slug
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string }
          example: dinh-doc-lap
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SpotDetail" }
        "400": { $ref: "#/components/responses/InvalidLang" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/spots/qr/{code}:
    get:
      tags: [Spots]
      summary: Tìm điểm theo mã QR (nội dung quét được từ mã QR)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: TM-001
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SpotDetail" }
        "400": { $ref: "#/components/responses/InvalidLang" }
        "404": { $ref: "#/components/responses/NotFound" }
  /health:
    get:
      summary: Kiểm tra server (dùng để "đánh thức" Render free trước khi demo)
      responses:
        "200":
          description: OK
          content:
            application/json:
              example: { status: ok, time: "2026-10-07T03:00:00.000Z" }
components:
  parameters:
    Lang:
      name: lang
      in: query
      description: Mã ngôn ngữ (vi, en, ja, ko). Mặc định `vi`.
      schema: { type: string, default: vi }
  responses:
    InvalidLang:
      description: Ngôn ngữ không được hỗ trợ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: INVALID_LANG, message: "Ngôn ngữ 'xx' chưa được hỗ trợ" } }
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: SPOT_NOT_FOUND, message: Không tìm thấy điểm tham quan } }
  schemas:
    Language:
      type: object
      required: [code, name, nativeName, ttsLocale]
      properties:
        code: { type: string, example: ja }
        name: { type: string, example: Japanese }
        nativeName: { type: string, example: 日本語 }
        ttsLocale: { type: string, example: ja-JP }
    SpotSummary:
      type: object
      required:
        [id, slug, qrCode, latitude, longitude, lang, fallback, title, summary, availableLanguages]
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: dinh-doc-lap }
        qrCode: { type: string, example: TM-001 }
        latitude: { type: number, example: 10.777 }
        longitude: { type: number, example: 106.6955 }
        imageUrl: { type: string, nullable: true }
        lang: { type: string, example: en }
        fallback: { type: boolean, example: false }
        title: { type: string, example: Independence Palace }
        summary: { type: string }
        availableLanguages:
          type: array
          items: { type: string }
          example: [en, ja, ko, vi]
    SpotDetail:
      allOf:
        - $ref: "#/components/schemas/SpotSummary"
        - type: object
          required: [narration]
          properties:
            narration:
              type: string
              description: Nội dung thuyết minh đầy đủ, đưa thẳng vào TTS
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
