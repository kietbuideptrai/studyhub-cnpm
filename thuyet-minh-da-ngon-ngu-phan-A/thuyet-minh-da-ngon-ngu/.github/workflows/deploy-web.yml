name: Deploy web (Vercel)

# - Moi Pull Request: tao ban PREVIEW va comment link vao PR
# - Push vao main: deploy PRODUCTION
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # PR tu fork khong co secrets -> bo qua nhe nhang thay vi do CI
      - name: Kiem tra secrets
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chua cau hinh VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID, bo qua deploy"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cai Vercel CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --global vercel@latest

      - name: Pull cau hinh Vercel
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ENV=$([ "${{ github.event_name }}" = "push" ] && echo production || echo preview)
          vercel pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        run: |
          FLAG=$([ "${{ github.event_name }}" = "push" ] && echo "--prod" || echo "")
          vercel build $FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        run: |
          FLAG=$([ "${{ github.event_name }}" = "push" ] && echo "--prod" || echo "")
          URL=$(vercel deploy --prebuilt $FLAG --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Web deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment link preview vao PR
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- web-preview -->';
            const body = `${marker}\n🔗 **Web preview:** ${process.env.PREVIEW_URL}\n\nCommit: \`${context.sha.slice(0, 7)}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const old = comments.find((c) => c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
