name: Build APK (EAS)

# Chay tay: Actions -> "Build APK (EAS)" -> Run workflow
# Hoac tu dong khi dat tag dang mobile-v1.0.0
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile trong apps/mobile/eas.json
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags: ["mobile-v*"]

concurrency:
  group: eas-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Kiem tra EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Thieu secret EXPO_TOKEN (expo.dev -> Account settings -> Access tokens)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cai dependencies
        run: pnpm install --frozen-lockfile

      - name: EAS build (Android APK)
        working-directory: apps/mobile
        run: |
          PROFILE="${{ inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > build.json
          cat build.json

      - name: Ghi link APK vao summary
        working-directory: apps/mobile
        run: |
          URL=$(node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));console.log(b[0]?.artifacts?.buildUrl ?? '')")
          if [ -z "$URL" ]; then echo "::error::Khong lay duoc link APK"; exit 1; fi
          {
            echo "### APK san sang"
            echo ""
            echo "[Tai APK]($URL)  (link het han sau mot thoi gian, hay luu ban dung de demo)"
          } >> "$GITHUB_STEP_SUMMARY"
